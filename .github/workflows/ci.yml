name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: npx expo export --platform web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Robot Framework
        run: python -m pip install -r robot/requirements.txt
      - name: Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
      - name: Robot Framework suites
        run: npm run test:robot
        env:
          LIVE_API: https://face-code-pink.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: results/
